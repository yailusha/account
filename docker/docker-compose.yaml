services:
  postgres:
    image: postgres:latest
    container_name: account_db
    ports: [ "5132:5432" ]
    env_file: [ .env ]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - redis-network
  
  redis:
    container_name: book-redis
    platform: linux/x86_64
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - 6379:6379
    networks: 
      - redis-network
    env_file: [ .env ]
    volumes:
      - redis_data:/data
  
  redis_commander:
    container_name: book-redis-commander
    image: rediscommander/redis-commander:latest
    platform: linux/x86_64
    restart: always
    environment:
      REDIS_HOSTS: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: [ "29094:8081" ]
    networks:
      - redis-network
    env_file: [ .env ]
  
volumes: 
  postgres_data:
    driver: local
  redis_data: 
    driver: local
networks:
  redis-network:
    driver: bridge
